<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100vh;
            /* background-color: rgba(0,0,0,0.7); */
        }
        .content{
            height: 550px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .content h1{
            font-size: 95px;
            color: white;
        }
        .content a{
            font-size: 54px;
            text-decoration: none;
            margin-top: 20px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 14px 12px;
            border-radius: 15px;
            background-color: beige;
            color: black;
            font-weight: 400;
        }
         video{
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
         }
         h1:hover{
            -webkit-text-stroke: 2px white;
            color: transparent;
            transition: 0.78s;
            cursor: pointer;
         }
         a:hover{
            background: linear-gradient(to right,rgb(86, 52, 196),rgb(19, 165, 68));
            box-shadow: 10px 10px 50px 12px rgba(236, 234, 238, 0.818);
            transform: scale(1.2);
            transition: 1.2s ;
            color: white;
         }
    </style>
</head>
<body>
    <div class="container">
        <video src="./vdo1.mp4" autoplay loop plays-inline muted></video>
        <div class="content">
            <h1>Quote Generator</h1>
            <a href="./index.html" target="_parent">Try It!!</a>
        </div>
    </div>
</body>
</html>
