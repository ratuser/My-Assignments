<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #root{
            width: 900px;
            height: 600px;
            border: 2px solid black;
            margin: 0 auto;
        }
        #buttons{
            display: flex;
            justify-content: center;
            padding: 10px;
            column-gap: 20px;
        }
        .but{
            font-size: 20px;
            border: 3px solid black;
        }
        .bt1:hover{
            background-color: Yellow;
            color: black;
            transition: 1s;
        }
        .bt2:hover{
            background-color: blue;
            color: black;
            transition: 1s;
        }
        .bt3:hover{
            background-color: Green;
            color: black;
            transition: 1s;
        }
        .bt4:hover{
            background-color: hotpink;
            color: black;
            transition: 1s;
        }
        .bt5:hover{
            background-color: black;
            color: white;
            transition: 1s;
        }
        .bt6:hover{
            background-color: purple;
            color: black;
            transition: 1s;
        }
    </style>
</head>
<body>
    <div id="root">
        
    </div>
    <div id="buttons">
        <button class="but bt1" onclick="Yellow()">Yellow</button>
        <button class="but bt2" onclick="Blue()">Blue</button>
        <button class="but bt3" onclick="Green()">Green</button>
        <button class="but bt4" onclick="Pink()">Pink</button>
        <button class="but bt5" onclick="Black()">Black</button>
        <button class="but bt6" onclick="Purple()">Purple</button>
    </div>
    <script>
        function Yellow(){
            let root=document.getElementById('root')
            root.style.backgroundColor="yellow"
        }
        function Blue(){
            let root=document.getElementById('root')
            root.style.backgroundColor="blue"
        }
        function Green(){
            let root=document.getElementById('root')
            root.style.backgroundColor="green"
        }
        function Pink(){
            let root=document.getElementById('root')
            root.style.backgroundColor="hotpink"
        }
        function Black(){
            let root=document.getElementById('root')
            root.style.backgroundColor="black"
        }
        function Purple(){
            let root=document.getElementById('root')
            root.style.backgroundColor="purple"
        }
    </script>
</body>
</html>
